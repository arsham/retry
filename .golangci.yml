version: "2"
run:
  build-tags:
    - integration
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - gomodguard
    - mnd
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 30
      package-average: 5
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enable-all: true
    gocyclo:
      min-complexity: 15
    godot:
      capital: true
    govet:
      enable:
        - assign
        - atomic
        - atomicalign
        - bools
        - buildtag
        - cgocall
        - composites
        - copylocks
        - deepequalerrors
        - errorsas
        - fieldalignment
        - findcall
        - framepointer
        - httpresponse
        - ifaceassert
        - loopclosure
        - lostcancel
        - nilfunc
        - printf
        - reflectvaluecompare
        - shift
        - sigchanyzer
        - sortslice
        - stdmethods
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
    misspell:
      locale: UK
    paralleltest:
      ignore-missing-subtests: true
    staticcheck:
      checks:
        - all
    unparam:
      check-exported: true
    varnamelen:
      ignore-decls:
        - t testing.T
        - i int
        - fn repeatFunc
    wrapcheck:
      ignore-sigs:
        - (context.Context).Err()
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - err113
          - gocritic
          - gosec
          - nlreturn
          - varnamelen
        path: _test\.go
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - model
      - tmp
      - bin
      - scripts
      - third_party$
      - builtin$
      - examples$
issues:
  fix: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - model
      - tmp
      - bin
      - scripts
      - third_party$
      - builtin$
      - examples$
